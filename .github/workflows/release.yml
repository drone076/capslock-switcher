name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      exe-path: dist/capslock_switcher.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable + Windows target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64 (linker + windres for .rc embedding)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Configure Cargo linker for Windows target
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Strip binary (reduce size)
        run: x86_64-w64-mingw32-strip target/x86_64-pc-windows-gnu/release/capslock_switcher.exe

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/capslock_switcher.exe dist/capslock_switcher.exe

      - name: Show binary size
        run: ls -lh dist/capslock_switcher.exe

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: capslock-switcher-exe
          path: dist/capslock_switcher.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: capslock-switcher-exe
          path: dist

      - name: Copy installers into dist
        run: |
          cp install.bat dist/install.bat
          cp uninstall.bat dist/uninstall.bat

      - name: Create GitHub release and upload exe + installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/capslock_switcher.exe
            dist/install.bat
            dist/uninstall.bat
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
