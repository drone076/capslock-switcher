name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      exe-path: dist/capslock_switcher.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare dist directory
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/capslock_switcher.exe dist/capslock_switcher.exe

      - name: Show binary size
        shell: bash
        run: ls -lh dist/capslock_switcher.exe

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: capslock-switcher-exe
          path: dist/capslock_switcher.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: capslock-switcher-exe
          path: dist

      - name: Copy installers and readmes into dist
        run: |
          cp install.bat dist/install.bat
          cp uninstall.bat dist/uninstall.bat
          cp README.txt dist/README.txt
          cp README.en.txt dist/README.en.txt

      - name: Create CapslockSwitcher_Setup.zip
        run: |
          cd dist
          zip -j CapslockSwitcher_Setup.zip capslock_switcher.exe install.bat uninstall.bat README.txt README.en.txt
          cd ..

      - name: Create GitHub release and upload all assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/capslock_switcher.exe
            dist/install.bat
            dist/uninstall.bat
            dist/README.txt
            dist/README.en.txt
            dist/CapslockSwitcher_Setup.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
